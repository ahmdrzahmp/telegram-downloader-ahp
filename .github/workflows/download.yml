name: Download Video from Direct Link

on:
  workflow_dispatch:
    inputs:
      direct_url:
        description: 'لینک مستقیم ویدیو (از تلگرام وب کپی شده)'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: دانلود با curl
        run: curl -L -o video.mp4 "${{ github.event.inputs.direct_url }}"

      - name: آپلود Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
